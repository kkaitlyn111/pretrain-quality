[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pretrain-quality"
version = "0.1.0"
description = "What does a pretraining quality filter reward? Interpretable per-document features, a causal swarm-based quality target, and an EBM that explains it."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kaitlyn Wang" }, { name = "Angikar Ghosal" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "interpret==0.7.8",      # pinned: models/ebm_no_pc.joblib was pickled with it
    "joblib>=1.3",
    "textstat==0.7.13",      # pinned: readability values change across versions
    "tldextract>=5",
    "zstandard>=0.22",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Recompute the model-scored features (spaCy entities, fastText textbook-quality,
# RoBERTa AI-detector, QuRater-1.3B).
models = [
    "spacy>=3.7",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "fasttext>=0.9.3",
    "huggingface-hub>=0.24",
    "torch>=2.3",
    "transformers>=4.44",
]
# Full cluster pipeline: swarm training, validation runs, benchmarks, figures.
pipeline = [
    "pretrain-quality[models]",
    "datasets>=2.20",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "wandb>=0.17",
]
# Experimental EK-FAC influence target (pipeline/influence/).
influence = ["pretrain-quality[pipeline]", "kronfluence>=1.0.1"]
dev = ["pytest>=8"]

[project.scripts]
pq = "pretrain_quality.quickstart:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"pretrain_quality.features" = ["stopwords_en.txt"]
